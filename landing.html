<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Premier League</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@700&family=Michroma&family=Orbitron:wght@600;700;800;900&family=Syne:wght@800&family=Teko:wght@700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/landing.css">
</head>
<body>
  <div class="bg-photo"></div>
  <div class="bg-tint"></div>
  <div class="aurora"><span class="a1"></span><span class="a2"></span></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <canvas id="stars"></canvas>

  <main class="hero">
    <div class="badge-wrap" id="badgeWrap">
      <div class="badge-glow"></div>
      <div class="orbit-ring"></div>
      <img src="assets/images/mpl-crest.png" alt="Math Premier League crest">
    </div>
    <h1 class="wordmark"><span class="line1">MATH</span><span class="line2">PREMIER LEAGUE</span></h1>

    <button class="login-outer" id="openLogin">
      <span class="login-face">
        <span class="login-label">Log In</span>
      </span>
    </button>
  </main>

  <!-- Scripts -->
  <script src="assets/js/landing.js"></script>
</body>
</html>
